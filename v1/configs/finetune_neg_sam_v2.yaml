model:
  input_dim: 128
  hidden_dim: 128
  dropout: 0.3
  num_layers: 4
  num_heads: 8
  structure_pe_dim: 8

training:
  seed: 7
  device: cuda
  lr: 0.001
  weight_decay: 0.0005
  finetune_epochs: 1000
  num_seeds: 3
  early_stopping:
    patience: 50
  output_dir: outputs_neg_sam_v2
  pretrained_checkpoint: outputs_neg_sam_v2/checkpoints/pretrain_last_neg_sam.pt
  task_name: node

data:
  datasets:
    - cora_cc
    - citeseer_cc
    - pubmed_cc
    - coauthorship_cora
    - coauthorship_dblp
    - cooking_200
  domain_map:
    cora_cc: citation
    citeseer_cc: citation
    pubmed_cc: citation
    coauthorship_cora: academic
    coauthorship_dblp: academic
    cooking_200: document
  cache_dir: data/cache
  splits:
    train_ratio: 0.6
    val_ratio: 0.2
