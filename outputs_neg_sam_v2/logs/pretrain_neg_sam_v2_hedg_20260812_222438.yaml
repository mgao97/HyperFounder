data:
  cache_dir: data/cache
  datasets:
  - cora_cc
  - citeseer_cc
  - pubmed_cc
  - coauthorship_dblp
  - cooking_200
  - gowalla
  - yelp_2018
  domain_map:
    citeseer_cc: citation
    coauthorship_dblp: academic
    cooking_200: document
    cora_cc: citation
    gowalla: recommendation
    pubmed_cc: citation
    yelp_2018: recommendation
  splits:
    train_ratio: 0.6
    val_ratio: 0.2
model:
  adapter_dim: 32
  adapter_type: adapter
  dropout: 0.3
  hidden_dim: 128
  input_dim: 128
  num_experts: 4
  num_heads: 8
  num_layers: 4
  structure_pe_dim: 8
  use_domain_adapter: true
neg_sampling:
  hedg_negatives:
    enabled: true
    temperature: 0.5
  hyperedge:
    max_attempts: 10
    min_negative_edge_size: 2
    modes:
    - replace
    - overlap
    - random
    num_neg_per_pos: 2
  membership:
    max_membership_hop: 3
    min_edges_for_node_contrastive: 2
    min_nodes_for_node_contrastive: 8
    num_neg_per_pos: 2
  subgraph:
    min_component_ratio: 0.5
    min_incidence_density: 0.05
    min_overlap_density: 0.05
    num_neg_per_pos: 2
training:
  alignment_proj_dim: 64
  contrastive_strategy: node_dropping
  contrastive_temperature: 0.1
  device: cuda
  early_stopping:
    patience: 80
  edge_dropout_rate: 0.2
  edge_num_prototypes: 32
  enabled_tasks:
  - masked_node
  - hyperedge_recon
  - contrastive
  - size_pred
  - domain_align
  - membership_contrast
  - motif
  - community
  - structure_align
  - structure_discrimination
  - orth_node
  - orth_edge
  - private_domain_node
  - private_domain_edge
  epochs: 300
  feature_mask_rate: 0.15
  hard_negative_bank_size: 1000
  hard_negative_num_tiers: 3
  hard_negative_sampling_strategy: quality_weighted
  log_interval_steps: 1
  log_quality_stats: true
  log_step_history: true
  loss_weights:
    community: 0.5
    contrastive: 1.0
    domain_align: 0.1
    hyperedge_recon: 1.0
    masked_node: 1.0
    membership_contrast: 0.2
    motif: 0.5
    orth_edge: 0.02
    orth_node: 0.02
    private_domain_edge: 0.05
    private_domain_node: 0.05
    size_pred: 1.0
    structure_align: 0.3
    structure_discrimination: 0.3
  lr: 0.001
  min_masked_nodes: 4
  min_membership_nodes: 2
  minibatch:
    domains_per_step: 2
    expansion_hops: 2
    large_graph_node_threshold: 5000
    max_edges: 128
    max_nodes: 256
    seed_edges_per_subhypergraph: 1
    subhypergraph_pool_size: 64
    subhypergraphs_per_domain: 2
    use_subhypergraph_pool: true
  motif_budget: 32
  node_num_prototypes: 32
  num_motif_types: 8
  num_prototypes: 8
  output_dir: outputs_neg_sam_v2
  private_dim: 128
  progress:
    leave_progress_bar: false
    mininterval_sec: 2.0
    show_epoch_bar: true
    show_pool_bar: true
    show_step_bar: true
  quality_min_edges: 2
  quality_min_nodes: 4
  seed: 7
  shared_dim: 128
  steps_per_epoch: 32
  tau_edge_align: 0.65
  tau_hard_negative: 0.4
  tau_hyperedge: 0.55
  tau_membership: 0.4
  tau_motif: 0.7
  tau_neg_low: 0.4
  tau_node_align: 0.6
  use_confidence_routing: true
  use_disentanglement: true
  use_domain_alignment: true
  use_edge_alignment: true
  use_hard_negative_bank: true
  use_node_alignment: true
  use_quality_routing: true
  use_task_routing: false
  weight_decay: 0.0001
