# Full pretraining configuration.
# This file is meant for complete cross-domain pretraining:
# 1. Uses all supported datasets.
# 2. Enables all current self-supervised pretraining tasks.
# 3. Keeps detailed runtime logs and per-step history for later debugging.

model:
  # Unified input feature size after dataset-side resizing/padding.
  input_dim: 128
  # Shared hidden size for node/edge tokens across all domains.
  hidden_dim: 128
  dropout: 0.3
  # Depth of the shared hypergraph encoder.
  num_layers: 4
  num_heads: 8
  # Structural PE width before alignment into hidden_dim.
  structure_pe_dim: 8

training:
  seed: 7
  # Keep cpu here as a safe default; runtime device is usually overridden by --device.
  device: cpu
  # Full run target. Early stopping can stop training earlier if the loss stalls.
  epochs: 300
  # Each epoch samples multiple cross-domain subhypergraph mini-batches.
  steps_per_epoch: 32
  # Enable all currently implemented pretraining tasks.
  enabled_tasks:
    - masked_node
    - hyperedge_recon
    - contrastive
    - size_pred
    - domain_align
  # Keep a per-step CSV for postmortem debugging and loss inspection.
  log_step_history: true
  # Print every training step to the nohup log for easier tail -f debugging.
  log_interval_steps: 1
  lr: 0.001
  weight_decay: 0.0001
  motif_budget: 32
  feature_mask_rate: 0.15
  edge_dropout_rate: 0.2
  contrastive_strategy: node_dropping
  output_dir: outputs
  early_stopping:
    patience: 50
  # Progress bars remain visible both interactively and in runtime logs.
  progress:
    show_epoch_bar: true
    show_step_bar: true
    show_pool_bar: true
    leave_progress_bar: false
    mininterval_sec: 2.0
  minibatch:
    # Each step mixes 2 domains to preserve cross-domain supervision.
    domains_per_step: 2
    # Sample 2 subhypergraphs from each chosen domain per step.
    subhypergraphs_per_domain: 2
    max_nodes: 256
    max_edges: 128
    expansion_hops: 2
    seed_edges_per_subhypergraph: 1
    # Large graphs use a cached subhypergraph pool to improve runtime stability.
    use_subhypergraph_pool: true
    subhypergraph_pool_size: 512
    large_graph_node_threshold: 5000
  loss_weights:
    masked_node: 1.0
    hyperedge_recon: 1.0
    contrastive: 1.0
    size_pred: 1.0
    # Keep domain alignment lighter than reconstruction/contrastive objectives.
    domain_align: 0.1

data:
  # Full cross-domain dataset suite used by the current project.
  datasets:
    - cora_cc
    - citeseer_cc
    - pubmed_cc
    - coauthorship_dblp
    - imdb_4k
    - cooking_200
    - gowalla
    - yelp_2018
  domain_map:
    cora_cc: citation
    citeseer_cc: citation
    pubmed_cc: citation
    coauthorship_dblp: academic
    imdb_4k: academic
    cooking_200: document
    gowalla: recommendation
    yelp_2018: recommendation
  cache_dir: data/cache
  splits:
    train_ratio: 0.6
    val_ratio: 0.2
