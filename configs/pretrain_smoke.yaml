model:
  input_dim: 128
  hidden_dim: 128
  dropout: 0.3
  num_layers: 2
  num_heads: 4
  structure_pe_dim: 4

training:
  seed: 7
  device: cpu
  epochs: 10
  steps_per_epoch: 2
  enabled_tasks:
    - masked_node
    - hyperedge_recon
    - contrastive
    - size_pred
  log_step_history: false
  lr: 0.001
  weight_decay: 0.0001
  motif_budget: 4
  feature_mask_rate: 0.15
  edge_dropout_rate: 0.2
  contrastive_strategy: node_dropping
  output_dir: outputs
  early_stopping:
    patience: 2
  minibatch:
    domains_per_step: 1
    subhypergraphs_per_domain: 1
    max_nodes: 128
    max_edges: 64
    expansion_hops: 2
    seed_edges_per_subhypergraph: 1
    use_subhypergraph_pool: false
    subhypergraph_pool_size: 4
    large_graph_node_threshold: 5000
  loss_weights:
    masked_node: 1.0
    hyperedge_recon: 1.0
    contrastive: 1.0
    size_pred: 1.0
    domain_align: 0.0

data:
  datasets:
    - cora_cc
    - cooking_200
  domain_map:
    cora_cc: citation
    cooking_200: document
  cache_dir: data/cache
